<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Simulação Imobiliária</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--p:#0056b3;--w:#25D366;--b:#f4f4f9;--wh:#ffffff;--t:#333333}*{box-sizing:border-box;outline:0;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-color:var(--b);margin:0;padding:15px;display:flex;justify-content:center;align-items:center;min-height:100vh;color:var(--t);-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}input,select{user-select:text;-webkit-user-select:text}.c{background:var(--wh);padding:20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.05);width:100%;max-width:450px;display:flex;flex-direction:column}h2{text-align:center;margin:0 0 20px 0;font-size:1.1rem;color:#222;text-transform:uppercase;line-height:1.4;border-bottom:2px solid #eee;padding-bottom:15px}.f-g{margin-bottom:15px}label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:#555}input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:1rem;background:#fff;-webkit-appearance:none;height:45px;color:#333}select{background-image:url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23333%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");background-repeat:no-repeat;background-position:right 12px top 50%;background-size:12px auto}input:focus,select:focus{border-color:var(--p)}.b-g{margin-top:25px}button{width:100%;padding:16px;border:none;border-radius:8px;font-size:1rem;font-weight:bold;cursor:pointer;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .2s;background-color:var(--w);color:#fff;box-shadow:0 4px 10px rgba(37,211,102,.3)}button:active{opacity:.8;transform:scale(.98)}.ft{margin-top:20px;text-align:center;font-size:.85rem;color:#888}
</style>
</head>
<body oncontextmenu="return false" ondragstart="return false">
<div class="c"><h2>Dados para Simulação de<br>Financiamento Imobiliário</h2><form id="f1"><div class="f-g"><label>Data de Nascimento</label><input type="tel" id="nasc" placeholder="DD/MM/AAAA" maxlength="10" oninput="_mDt(this)" required></div><div class="f-g"><label>Estado Civil</label><select id="ec"><option value="Solteiro(a)">Solteiro(a)</option><option value="Casado(a)">Casado(a)</option><option value="Separado(a)">Separado(a)</option><option value="Divorciado(a)">Divorciado(a)</option><option value="Viúvo(a)">Viúvo(a)</option><option value="União Estável">União Estável</option></select></div><div class="f-g"><label>Pretende comprar sozinho(a)?</label><select id="cs"><option value="Sim">Sim</option><option value="Não">Não</option></select></div><div class="f-g"><label>Renda Bruta Pessoal</label><input type="text" id="rnd" class="m" placeholder="R$ 0,00" inputmode="numeric" onkeyup="_fM(this)" required></div><div class="f-g"><label>Tipo de Renda</label><select id="tr"><option value="Formal CLT">Formal CLT</option><option value="Informal / Autônomo">Informal / Autônomo</option><option value="Pró Labore">Pró Labore</option><option value="Misto (Formal + Informal)">Misto (Formal + Informal)</option></select></div><div class="f-g"><label>Declarou Imposto de Renda (IRPF/IRPJ)?</label><select id="dir"><option value="Sim">Sim</option><option value="Não">Não</option></select></div><div class="f-g"><label>Último ano da declaração (se houver)</label><input type="number" id="air" placeholder="Ex: 2024" inputmode="numeric"></div><div class="f-g"><label>Saldo de FGTS Pessoal</label><input type="text" id="fgts" class="m" placeholder="R$ 0,00" inputmode="numeric" onkeyup="_fM(this)" required></div><div class="f-g"><label>Valor Disponível (Entrada)</label><input type="text" id="ent" class="m" placeholder="R$ 0,00" inputmode="numeric" onkeyup="_fM(this)" required></div><div class="f-g"><label>Mais de 3 anos de contribuição FGTS?</label><select id="tfg"><option value="Não">Não</option><option value="Sim">Sim</option></select></div><div class="f-g"><label>Possui dívidas, acordos ou renegociações?</label><select id="div"><option value="Não">Não</option><option value="Sim">Sim</option></select></div><div class="b-g"><button type="button" onclick="_zRun()"><svg width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326z"></path></svg> Enviar para Roger</button></div></form><div class="ft">Consultor: <strong>Roger Oliveira</strong></div></div>
<script>
// --- PROTEÇÃO ATIVA ---
(function(){const _0x=console;Object.defineProperty(window,"console",{get:function(){if(_0x._commandLineAPI)throw"Erro de Acesso";return _0x},set:function(v){_0x=v}})})();
setInterval(function(){const t=performance.now();debugger;if(performance.now()-t>200){document.body.innerHTML="";window.location.reload()}},2000);
document.addEventListener('contextmenu',e=>e.preventDefault());
document.onkeydown=function(e){const k=e.keyCode;if(k==123||(e.ctrlKey&&e.shiftKey&&(k==73||k==67||k==74))||(e.ctrlKey&&(k==85||k==83||k==80)))return!1};

// --- LÓGICA OFUSCADA ---
const _g=(id)=>document.getElementById(id);
const inputs=document.querySelectorAll('input, select');
inputs.forEach(i=>{i.addEventListener('focus',function(){setTimeout(()=>{this.scrollIntoView({behavior:'smooth',block:'center'})},300)})});

function _mDt(v){let x=v.value.replace(/\D/g,"");if(x.length>2)x=x.replace(/^(\d{2})(\d)/,"$1/$2");if(x.length>5)x=x.replace(/^(\d{2})\/(\d{2})(\d)/,"$1/$2/$3");v.value=x}
_g('air').addEventListener('input',function(){const v=parseInt(this.value),a=new Date().getFullYear();if(this.value.length>=4&&v>a){alert("Ano inválido.");this.value=a}});

function _fM(i){var v=i.value.replace(/\D/g,'');v=(v/100).toFixed(2)+'';v=v.replace(".",",");v=v.replace(/(\d)(?=(\d{3})+(?!\d))/g,'$1.');i.value="R$ "+v}

function _zRun(){
    const n=_g("nasc").value,r=_g("rnd").value;
    if(!n||!r){alert("Preencha Nascimento e Renda.");return}
    const d={n:n,c:_g("ec").value,s:_g("cs").value,r:r||"R$ 0,00",t:_g("tr").value,d:_g("dir").value,a:_g("air").value||"--",f:_g("fgts").value||"R$ 0,00",e:_g("ent").value||"R$ 0,00",tf:_g("tfg").value,dv:_g("div").value,h:new Date().toLocaleDateString("pt-BR")};
    _pG(d); _wS(d);
}

function _pG(o){
    const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a5"});
    doc.setFillColor(255,255,255);doc.rect(0,0,148,210,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(0,50,100);
    doc.text("DADOS PARA SIMULAÇÃO DE\nFINANCIAMENTO IMOBILIÁRIO",74,12,{align:"center"});
    doc.setFontSize(8);doc.setTextColor(100);doc.setFont("helvetica","normal");
    doc.text(`Data: ${o.h}`,138,12,{align:"right"});
    doc.setLineWidth(0.5);doc.setDrawColor(200);doc.line(10,20,138,20);
    let y=30;
    const _l=(l,v)=>{
        doc.setFont("helvetica","bold");doc.setTextColor(50);doc.text(l,10,y);
        doc.setFont("helvetica","normal");doc.setTextColor(0);doc.text(v,138,y,{align:"right"});
        doc.setDrawColor(240);doc.line(10,y+2,138,y+2);y+=8;
    };
    _l("Data de Nascimento:",o.n);_l("Estado Civil:",o.c);_l("Comprar Sozinho(a):",o.s);
    y+=2;_l("Renda Bruta:",o.r);_l("Tipo de Renda:",o.t);_l("Declarou IR:",o.d);
    if(o.d==="Sim")_l("Último Ano IR:",o.a);else y+=2;
    _l("Saldo FGTS:",o.f);_l("Valor Entrada:",o.e);_l("+3 Anos de FGTS:",o.tf);_l("Possui Dívidas:",o.dv);
    y+=10;doc.setFontSize(7);doc.setTextColor(150);
    doc.text("Consultor: Roger Oliveira",74,y,{align:"center"});
    doc.text("Contato: (31) 93618-0070",74,y+4,{align:"center"});
    doc.save("Ficha_Simulacao_RogerOliveira.pdf");
}

function _wS(o){
    const _ph = atob('NTUzMTkzNjE4MDA3MA=='); // Número codificado
    let t=`*OLÁ ROGER, SEGUEM MEUS DADOS:*%0a%0a*--- PESSOAL ---*%0a*Nascimento:* ${o.n}%0a*Est. Civil:* ${o.c}%0a*Comprar Sozinho:* ${o.s}%0a%0a*--- FINANCEIRO ---*%0a*Renda:* ${o.r}%0a*Tipo:* ${o.t}%0a*Declarou IR:* ${o.d} (Ano: ${o.a})%0a%0a*--- RECURSOS ---*%0a*FGTS:* ${o.f}%0a*Entrada:* ${o.e}%0a*3 anos FGTS:* ${o.tf}%0a*Dívidas:* ${o.dv}%0a%0a_(O PDF com os dados também foi baixado)_`;
    window.open(`https://wa.me/${_ph}?text=${t}`,"_blank");
}
</script>
</body>
</html>
