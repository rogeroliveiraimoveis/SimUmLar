<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Simulação Imobiliária</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    :root { --primary: #0056b3; --whatsapp: #25D366; --bg: #f4f4f9; --white: #ffffff; --text: #333333; }
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    /* Impede seleção de texto para dificultar cópia */
    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        background-color: var(--bg); 
        margin: 0; padding: 15px; 
        display: flex; justify-content: center; align-items: center; min-height: 100vh; 
        color: var(--text);
        -webkit-user-select: none; /* Safari */
        -moz-user-select: none; /* Firefox */
        -ms-user-select: none; /* IE10+/Edge */
        user-select: none; /* Padrão */
    }
    /* Permite selecionar apenas dentro dos inputs para digitar */
    input, select { user-select: text; -webkit-user-select: text; }
    
    .card { background: var(--white); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 450px; display: flex; flex-direction: column; }
    h2 { text-align: center; margin: 0 0 20px 0; font-size: 1.1rem; color: #222; text-transform: uppercase; line-height: 1.4; border-bottom: 2px solid #eee; padding-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; color: #555; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; background: #fff; -webkit-appearance: none; height: 45px; color: #333; }
    select { background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23333%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 12px top 50%; background-size: 12px auto; }
    input:focus, select:focus { border-color: var(--primary); }
    .btn-group { margin-top: 25px; }
    button { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; transition: opacity 0.2s; background-color: var(--whatsapp); color: white; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
    button:active { opacity: 0.8; transform: scale(0.98); }
    .footer { margin-top: 20px; text-align: center; font-size: 0.85rem; color: #888; }
</style>
</head>
<body oncontextmenu="return false" ondragstart="return false">

<div class="card">
    <h2>Dados para Simulação de<br>Financiamento Imobiliário</h2>
    <form id="formFin">
        <div class="form-group">
            <label>Data de Nascimento</label>
            <input type="tel" id="nascimento" placeholder="DD/MM/AAAA" maxlength="10" oninput="mascaraData(this)" required>
        </div>

        <div class="form-group">
            <label>Estado Civil</label>
            <select id="estadoCivil">
                <option value="Solteiro(a)">Solteiro(a)</option>
                <option value="Casado(a)">Casado(a)</option>
                <option value="Separado(a)">Separado(a)</option>
                <option value="Divorciado(a)">Divorciado(a)</option>
                <option value="Viúvo(a)">Viúvo(a)</option>
                <option value="União Estável">União Estável</option>
            </select>
        </div>

        <div class="form-group">
            <label>Pretende comprar sozinho(a)?</label>
            <select id="comprarSozinho">
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
            </select>
        </div>

        <div class="form-group">
            <label>Renda Bruta Pessoal</label>
            <input type="text" id="renda" class="money" placeholder="R$ 0,00" inputmode="numeric" onkeyup="formatarMoeda(this)" required>
        </div>

        <div class="form-group">
            <label>Tipo de Renda</label>
            <select id="tipoRenda">
                <option value="Formal CLT">Formal CLT</option>
                <option value="Informal / Autônomo">Informal / Autônomo</option>
                <option value="Pró Labore">Pró Labore</option>
                <option value="Misto (Formal + Informal)">Misto (Formal + Informal)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Declarou Imposto de Renda (IRPF/IRPJ)?</label>
            <select id="declarouIR">
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
            </select>
        </div>

        <div class="form-group">
            <label>Último ano da declaração (se houver)</label>
            <input type="number" id="anoIR" placeholder="Ex: 2024" inputmode="numeric">
        </div>

        <div class="form-group">
            <label>Saldo de FGTS Pessoal</label>
            <input type="text" id="fgts" class="money" placeholder="R$ 0,00" inputmode="numeric" onkeyup="formatarMoeda(this)" required>
        </div>

        <div class="form-group">
            <label>Valor Disponível (Entrada)</label>
            <input type="text" id="entrada" class="money" placeholder="R$ 0,00" inputmode="numeric" onkeyup="formatarMoeda(this)" required>
        </div>

        <div class="form-group">
            <label>Mais de 3 anos de contribuição FGTS?</label>
            <select id="tempoFgts">
                <option value="Não">Não</option>
                <option value="Sim">Sim</option>
            </select>
        </div>

        <div class="form-group">
            <label>Possui dívidas, acordos ou renegociações?</label>
            <select id="dividas">
                <option value="Não">Não</option>
                <option value="Sim">Sim</option>
            </select>
        </div>

        <div class="btn-group">
            <button type="button" onclick="processarEnvio()">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326z"/>
                </svg>
                Enviar para Roger
            </button>
        </div>
    </form>
    <div class="footer">Consultor: <strong>Roger Oliveira</strong></div>
</div>

<script>
    // --- SEGURANÇA: Bloqueio de Teclas e Botão Direito ---
    document.addEventListener('contextmenu', event => event.preventDefault()); 
    document.onkeydown = function(e) {
        if(e.keyCode == 123) { return false; } 
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } 
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; } 
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } 
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } 
        if(e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) { return false; } 
    }

    // --- NOVA FUNÇÃO: Auto-Scroll para guiar o usuário ---
    // Centraliza o campo na tela assim que ele ganha foco
    const inputs = document.querySelectorAll('input, select');
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            // Pequeno delay para garantir que o teclado mobile abriu
            setTimeout(() => {
                this.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        });
    });

    // --- NOVA FUNÇÃO: Máscara Data de Nascimento ---
    function mascaraData(val) {
        let v = val.value.replace(/\D/g, ""); // remove o que não é dígito
        if (v.length > 2) v = v.replace(/^(\d{2})(\d)/, "$1/$2");
        if (v.length > 5) v = v.replace(/^(\d{2})\/(\d{2})(\d)/, "$1/$2/$3");
        val.value = v;
    }

    // --- NOVA VALIDAÇÃO: Ano IR ---
    document.getElementById('anoIR').addEventListener('input', function() {
        const valorDigitado = parseInt(this.value);
        const anoAtual = new Date().getFullYear();
        
        // Se tiver 4 dígitos e for maior que o ano atual, reseta
        if (this.value.length >= 4 && valorDigitado > anoAtual) {
            alert("O ano da declaração não pode ser futuro.");
            this.value = anoAtual; // Ou limpa com "" se preferir
        }
    });

    // --- 1. Função de Máscara de Dinheiro ---
    function formatarMoeda(i) {
        var v = i.value.replace(/\D/g,'');
        v = (v/100).toFixed(2) + '';
        v = v.replace(".", ",");
        v = v.replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
        i.value = "R$ " + v;
    }

    // --- 2. Função principal ao clicar no botão ---
    function processarEnvio() {
        const nascimento = document.getElementById("nascimento").value;
        const renda = document.getElementById("renda").value;

        if (!nascimento || !renda) {
            alert("Por favor, preencha a Data de Nascimento e a Renda.");
            return;
        }

        const dados = {
            nasc: nascimento, // Não precisa mais inverter data pois já está em texto PT-BR
            civil: document.getElementById("estadoCivil").value,
            sozinho: document.getElementById("comprarSozinho").value,
            renda: renda || "R$ 0,00",
            tipoRenda: document.getElementById("tipoRenda").value,
            declarouIR: document.getElementById("declarouIR").value,
            anoIR: document.getElementById("anoIR").value || "--",
            fgts: document.getElementById("fgts").value || "R$ 0,00",
            entrada: document.getElementById("entrada").value || "R$ 0,00",
            tempoFgts: document.getElementById("tempoFgts").value,
            dividas: document.getElementById("dividas").value,
            dataHoje: new Date().toLocaleDateString("pt-BR")
        };

        gerarPDF(dados);
        enviarWhatsApp(dados);
    }

    // --- 3. Função para Gerar PDF ---
    function gerarPDF(d) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "mm", format: "a5" });

        doc.setFillColor(255, 255, 255);
        doc.rect(0, 0, 148, 210, "F");

        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.setTextColor(0, 50, 100);
        doc.text("DADOS PARA SIMULAÇÃO DE\nFINANCIAMENTO IMOBILIÁRIO", 74, 12, { align: "center" });

        doc.setFontSize(8);
        doc.setTextColor(100);
        doc.setFont("helvetica", "normal");
        doc.text(`Data: ${d.dataHoje}`, 138, 12, { align: "right" });

        doc.setLineWidth(0.5);
        doc.setDrawColor(200);
        doc.line(10, 20, 138, 20);

        let y = 30;
        const linhaAltura = 8;

        function addLinha(rotulo, valor) {
            doc.setFont("helvetica", "bold");
            doc.setTextColor(50);
            doc.text(rotulo, 10, y);
            
            doc.setFont("helvetica", "normal");
            doc.setTextColor(0);
            doc.text(valor, 138, y, { align: "right" });

            doc.setDrawColor(240);
            doc.line(10, y + 2, 138, y + 2);
            y += linhaAltura;
        }

        addLinha("Data de Nascimento:", d.nasc);
        addLinha("Estado Civil:", d.civil);
        addLinha("Comprar Sozinho(a):", d.sozinho);
        
        y += 2;
        addLinha("Renda Bruta:", d.renda);
        addLinha("Tipo de Renda:", d.tipoRenda);
        addLinha("Declarou IR:", d.declarouIR);
        
        if (d.declarouIR === "Sim") {
            addLinha("Último Ano IR:", d.anoIR);
        } else {
            y += 2;
        }

        addLinha("Saldo FGTS:", d.fgts);
        addLinha("Valor Entrada:", d.entrada);
        addLinha("+3 Anos de FGTS:", d.tempoFgts);
        addLinha("Possui Dívidas:", d.dividas);

        y += 10;
        doc.setFontSize(7);
        doc.setTextColor(150);
        doc.text("Consultor: Roger Oliveira", 74, y, { align: "center" });
        doc.text("Contato: (31) 93618-0070", 74, y + 4, { align: "center" });

        doc.save("Ficha_Simulacao_RogerOliveira.pdf");
    }

    // --- 4. Função para WhatsApp ---
    function enviarWhatsApp(d) {
        // CORREÇÃO DE TEXTO DO TÍTULO
        let texto = `*OLÁ ROGER, SEGUEM MEUS DADOS:*%0a%0a`;
        texto += `*--- PESSOAL ---*%0a`;
        texto += `*Nascimento:* ${d.nasc}%0a`;
        texto += `*Est. Civil:* ${d.civil}%0a`;
        texto += `*Comprar Sozinho:* ${d.sozinho}%0a%0a`;
        texto += `*--- FINANCEIRO ---*%0a`;
        texto += `*Renda:* ${d.renda}%0a`;
        texto += `*Tipo:* ${d.tipoRenda}%0a`;
        texto += `*Declarou IR:* ${d.declarouIR} (Ano: ${d.anoIR})%0a%0a`;
        texto += `*--- RECURSOS ---*%0a`;
        texto += `*FGTS:* ${d.fgts}%0a`;
        texto += `*Entrada:* ${d.entrada}%0a`;
        texto += `*3 anos FGTS:* ${d.tempoFgts}%0a`;
        texto += `*Dívidas:* ${d.dividas}%0a%0a`;
        texto += `_(O PDF com os dados também foi baixado no meu dispositivo)_`;

        const numeroWhatsApp = "5531936180070";
        window.open(`https://wa.me/${numeroWhatsApp}?text=${texto}`, "_blank");
    }
</script>
</body>
</html>
